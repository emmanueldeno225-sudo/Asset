<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Événement</title>
<link rel="stylesheet" href="{{KIT}}/kit/affiche.css">
<style>
.affiche{--fond:#3A0A52;--fond2:#16041F;--primaire:#7B2CBF;--accent:#FFC233;--accent2:#FF4D8D;--clair:#FFF3DC;--encre:#22062F;
  --f-titre:'Poppins';--f-texte:'Poppins';--rayon:30px}
</style></head><body>
<div class="affiche f45">
  <div class="fond fond-radial" style="--px:72%;--py:44%;--taille:66%;--lueur:#9D4EDD"></div>
  <div class="motif-ondes" style="--px:88%;--py:8%;--motif:rgba(255,255,255,.05)"></div>
  <div class="lueur" style="--couleur:#FF4D8D;--d:420px;left:-200px;top:520px;--force:.4;--flou:70px"></div>
  <div class="grain" style="--force:.16"></div>

  <div class="logo-texte" style="left:64px;top:60px;font-size:26px"><span class="ic-anneau" data-ic="hands-praying" style="--d:58px"></span><span>Église Source de Vie<small>Abidjan · Riviera Palmeraie</small></span></div>

  <div class="abs z4" style="left:64px;top:180px;width:660px">
    <span class="surtitre" style="color:var(--accent);letter-spacing:.3em;font-size:24px">Soirée de louange</span>
    <div class="titre w9" style="font-size:132px;letter-spacing:-.045em;line-height:.86;margin-top:14px"><span style="color:#FFE3F0">Nuit</span><br><span class="c-accent">d'adoration</span></div>
    <span class="trait-pinceau" data-forme="2" style="--l:420px;--h:40px;--couleur:#FFB8D2;margin-top:14px"></span>
  </div>

  <!-- héros : orateur ou chantre -->
  <div class="heros-vide z3" style="right:-30px;bottom:0;width:560px;height:800px;--couleur:#5a1b85"></div>
  <span class="pilule noir abs z4" data-libre style="right:150px;top:920px;font-size:22px;opacity:.85">photo détourée ici</span>

  <!-- date -->
  <div class="abs z5" style="left:64px;top:560px">
    <div class="w5" style="font-size:30px;margin-bottom:10px">Rejoins-nous ce</div>
    <div class="bloc-date" style="--taille:128px;--annee:#FF4D8D">
      <span class="petit">Vendredi</span>
      <span class="jour">12 déc.</span>
      <span class="annee">2026</span>
    </div>
    <div class="titre w9" style="font-size:104px;letter-spacing:-.04em;margin-top:26px"><span class="w5" style="font-size:.42em;letter-spacing:0;vertical-align:.55em;margin-right:8px">à</span>18:30</div>
  </div>

  <div class="abs z5 rang g16" style="left:64px;top:1010px;align-items:flex-start;width:470px">
    <i class="ic" data-ic="map-pin" style="font-size:44px;color:var(--accent);margin-top:2px"></i>
    <div class="w4" style="font-size:27px;line-height:1.28"><span class="italique">Dans la grande salle du</span> <b>Palais des Congrès</b>, entrée par le boulevard Latrille</div>
  </div>
  <span class="filet abs z5" style="left:64px;top:1150px;--l:460px;--force:.4"></span>

  <div class="abs z5 pile g8" style="left:64px;bottom:60px">
    <span class="reseaux"><span class="ic-rond blanc" data-ic="m:instagram"></span><span class="ic-rond blanc" data-ic="m:facebook"></span><span class="ic-rond blanc" data-ic="m:tiktok"></span><span class="ic-rond blanc" data-ic="m:youtube"></span></span>
    <span class="w5" style="font-size:24px">@sourcedevie.abidjan · Entrée libre</span>
  </div>
</div>
<script src="{{KIT}}/kit/kit.js"></script></body></html>
